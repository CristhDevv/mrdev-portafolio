name: Security & Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high & critical)
        run: npm audit --audit-level=high

      - name: Check for potential committed secrets
        run: |
          if grep -rnE "(ghp_[A-Za-z0-9]{20,}|vcp_[A-Za-z0-9]{20,}|eyJhbGciOi|AIzaSy[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY\s*=)" src/ public/ index.html vercel.json; then
            echo "Potential secret detected in source!"
            exit 1
          fi

      - name: Verify TypeScript and production build
        run: npm run build
